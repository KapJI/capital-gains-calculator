version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
  - package-ecosystem: github-actions
    directories:
      # Workflows in .github/workflows
      - "/"
      # Composite actions are not covered by "/" and must be listed explicitly
      - "/.github/actions/*"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
      # Kodiak automerges any PR with this label. GitHub Actions major bumps
      # are safe to automerge; uv (Python) majors stay manual.
      - "automerge"
