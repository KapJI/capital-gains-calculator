name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "performance"
  - title: "🐛 Bug Fixes"
    labels:
      - "bug"
  - title: "📔 Documentation"
    labels:
      - "documentation"
  - title: "🏅 Code Quality Improvements"
    labels:
      - "code quality"
  - title: "🧪 Testing"
    labels:
      - "testing"
  - title: "🧱 Dependency Updates"
    labels:
      - "dependencies"
  - title: "🔧 Maintenance"
    labels:
      - "github structure"
      - "removal"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
# major/minor/patch labels are intentionally not used here: Dependabot applies
# them to describe the dependency's own version jump, which says nothing about
# this project's API.
version-resolver:
  major:
    labels:
      - "breaking"
  minor:
    labels:
      - "feature"
  default: patch
autolabeler:
  - label: "bug"
    title:
      - "/^fix[:(]/i"
  - label: "feature"
    title:
      - "/^feat[:(]/i"
  - label: "documentation"
    title:
      - "/^docs[:(]/i"
  - label: "testing"
    title:
      - "/^test[:(]/i"
  - label: "github structure"
    title:
      - "/^ci[:(]/i"
  - label: "code quality"
    title:
      - "/^refactor[:(]/i"
template: |
  ## Changes

  $CHANGES
