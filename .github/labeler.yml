# Schema reference: https://github.com/actions/labeler#match-object
# Options inside `all` are AND-ed. The rules are mutually exclusive, so a pull
# request gets at most one of them: each either claims a whole pull request or
# excludes the paths claimed by the rules above it. Dependabot labels its own
# pull requests, so its branches are skipped here. Anything touching Python
# source outside tests/ is left for a manual type label, as is any pull request
# spanning two of these areas.

dependencies:
  - all:
      - head-branch: ["^(?!dependabot/)"]
      - changed-files:
          # A dependency update only: nothing outside these files changed.
          - any-glob-to-any-file: "uv.lock"
          # One combined pattern: any-glob-to-all-files asks whether a
          # single glob matches every changed file, so a list of two would
          # never match the usual pair.
          - any-glob-to-all-files: "{uv.lock,pyproject.toml}"

github structure:
  - all:
      - head-branch: ["^(?!dependabot/)"]
      - changed-files:
          - any-glob-to-any-file: ".github/**/*"
          - all-globs-to-all-files: "!**/*.py"

testing:
  - all:
      - head-branch: ["^(?!dependabot/)"]
      - changed-files:
          # Every changed file has to be a test. Naming the directories to
          # exclude instead missed scripts/, so a change there was labelled
          # on the tests that came with it.
          - any-glob-to-all-files: "tests/**"

documentation:
  - all:
      - head-branch: ["^(?!dependabot/)"]
      - changed-files:
          - any-glob-to-any-file: "**/*.md"
          - all-globs-to-all-files: ["!**/*.py", "!.github/**/*", "!tests/**"]
