name: Labeler

on:
  pull_request_target:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    name: Triage
    if: github.repository_owner == 'KapJI'
    runs-on: ubuntu-latest
    steps:
      - name: Run Pull Request Labeler
        uses: actions/labeler@main
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
