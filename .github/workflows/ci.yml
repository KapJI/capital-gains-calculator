name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup prek cache
        uses: ./.github/actions/prek-cache
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run prek on all files
        env:
          SKIP: pytest
        run: |
          uvx prek run --all-files --show-diff-on-failure --color=always

      - name: Run python-typing-update
        run: |
          uvx prek run --hook-stage manual python-typing-update --all-files --show-diff-on-failure --color=always

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pytest
        env:
          CGT_TEST_MODE_STRICT: "1"
        run: uv run pytest -q

  coverage:
    name: Coverage
    if: github.repository_owner == 'KapJI'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pytest with coverage
        env:
          CGT_TEST_MODE_STRICT: "1"
        run: uv run pytest -q --cov

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Store pull request comment to be posted
        uses: actions/upload-artifact@v7
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

  markdown-link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Prepare and install deps
        uses: ./.github/actions/install-deps
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup prek cache
        uses: ./.github/actions/prek-cache
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run markdown-link-check
        run: |
          uvx prek run --hook-stage manual markdown-link-check --all-files --show-diff-on-failure --color=always

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: local/cgt-calc:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run pytest inside container
        run: |
          docker run --rm \
            -e ENABLE_PDFLATEX=1 \
            -e CGT_TEST_MODE_STRICT=1 \
            -v "${{ github.workspace }}:/build" \
            local/cgt-calc:test \
            -lc "cd /build && uv run pytest -q"

      - name: Upload e2e tests outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-outputs
          path: out/test-*
