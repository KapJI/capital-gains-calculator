codecov:
  notify:
    # Wait for all matrix jobs before setting statuses,
    # so they aren't computed from partial coverage.
    after_n_builds: 3

comment:
  after_n_builds: 3

coverage:
  status:
    project:
      default:
        # Compare against the base commit and block PRs that decrease
        # total coverage by more than the threshold.
        target: auto
        threshold: 0.5%
    patch:
      default:
        # Report coverage of changed lines without blocking the merge.
        informational: true

github_checks:
  # No per-line annotations in the diff view, the PR comment is enough.
  annotations: false
